client:
  name: angular-client
  image: qsdf5fdsq/client1:latest
  replicas: 1
  containerPort: 80

  service:
    name: angular-client-service
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30000
server:
  name: springboot-server
  image: qsdf5fdsq/server1:latest
  replicas: 1
  containerPort: 8080

  service:
    name: springboot-server-service
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
mysql:
  name: mysql
  image: mysql:8
  replicas: 1
  containerPort: 3306

  database: springbootdb
  user: springuser
  password: springpass
  rootPassword: rootpass

  secretName: mysql-secret

  service:
    name: mysql-service
    type: ClusterIP
    port: 3306
    targetPort: 3306
