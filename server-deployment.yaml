apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-server
  template:
    metadata:
      labels:
        app: springboot-server
    spec:
      containers:
        - name: springboot-server
          image: qsdf5fdsq/server1:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-server-service
spec:
  type: NodePort
  selector:
    app: springboot-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
