apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-client
  template:
    metadata:
      labels:
        app: angular-client
    spec:
      containers:
        - name: angular-client
          image: qsdf5fdsq/client1:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: angular-client-service
spec:
  type: NodePort
  selector:
    app: angular-client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
